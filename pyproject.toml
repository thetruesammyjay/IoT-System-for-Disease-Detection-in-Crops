[project]
name = "iot-tomato-disease-detection"
version = "0.1.0"
description = "Edge IoT system for tomato disease classification and environmental monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-socketio>=5.5,<6",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
simulation = [
    "onnxruntime>=1.20,<2",
]
training = [
    "matplotlib>=3.9,<4",
    "onnx>=1.17,<2",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<1",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]
hardware = [
    "adafruit-circuitpython-dht>=4,<5; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires Raspberry Pi hardware",
    "integration: exercises more than one application component",
    "training: requires dependencies from the training extra",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["crop-disease-detection"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
